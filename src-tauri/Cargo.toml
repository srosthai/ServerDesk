[package]
name = "serverdesk"
version = "0.1.0"
description = "Local-first desktop application for managing Linux VPS servers over SSH"
authors = ["ServerDesk"]
edition = "2024"

[lib]
name = "serverdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
thiserror = "2.0.21"
uuid = { version = "1.29.1", features = ["v4"] }
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
async-trait = "0.1.92"
russh = { version = "0.65.1", default-features = false, features = ["ring", "rsa"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
