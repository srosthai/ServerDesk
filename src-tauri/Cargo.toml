[package]
name = "serverdesk"
version = "0.1.0"
description = "Local-first desktop application for managing Linux VPS servers over SSH"
authors = ["ServerDesk"]
edition = "2024"

[lib]
name = "serverdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
